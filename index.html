<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Hill Racer</title>

<style>
html, body {
    margin: 0;
    overflow: hidden;
    background: #87CEEB;
    font-family: monospace;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#ui {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    z-index: 10;
    font-size: clamp(14px, 2vw, 24px);
    text-shadow: 2px 2px 0 black;
}

#controls {
    position: absolute;
    bottom: 20px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
}

.btn {
    width: 110px;
    height: 110px;
    border-radius: 18px;
    background: rgba(255,255,255,0.15);
    border: 3px solid white;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 34px;
    user-select: none;
}

@media (min-width: 900px){
    .btn{
        width: 90px;
        height: 90px;
    }
}

#startScreen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    z-index: 20;
    text-align: center;
}

#startScreen h1 {
    font-size: clamp(36px, 6vw, 72px);
    margin-bottom: 20px;
}

#startScreen p {
    font-size: clamp(16px, 2vw, 28px);
    margin-bottom: 30px;
    padding: 0 20px;
}

button {
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background: #ffd000;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="ui">
    <div id="distance">Distance: 0m</div>
    <div id="fuel">Fuel: 100%</div>
    <div id="coins">Coins: 0</div>
</div>

<div id="controls">
    <div class="btn" id="leftBtn">◀</div>
    <div class="btn" id="rightBtn">▶</div>
</div>

<div id="startScreen">
    <h1>Pixel Hill Racer</h1>
    <p>
        ПК: стрелки или A/D<br>
        Телефон: кнопки на экране
    </p>
    <button onclick="startGame()">Играть</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

const keys = {
    left:false,
    right:false
};

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowLeft"||e.key==="a") keys.left=true;
    if(e.key==="ArrowRight"||e.key==="d") keys.right=true;
});

document.addEventListener("keyup", e=>{
    if(e.key==="ArrowLeft"||e.key==="a") keys.left=false;
    if(e.key==="ArrowRight"||e.key==="d") keys.right=false;
});

function bindButton(id,key){
    const btn=document.getElementById(id);

    btn.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    btn.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key]=false;
    });

    btn.addEventListener("mousedown",()=>keys[key]=true);
    btn.addEventListener("mouseup",()=>keys[key]=false);
    btn.addEventListener("mouseleave",()=>keys[key]=false);
}

bindButton("leftBtn","left");
bindButton("rightBtn","right");

const terrain=[];

for(let i=0;i<6000;i++){
    terrain.push(
        Math.sin(i*0.05)*70+
        Math.sin(i*0.015)*120+
        canvas.height*0.68
    );
}

function groundHeight(x){
    const index=Math.floor(x/20);
    return terrain[index] || canvas.height;
}

const coins=[];

for(let i=20;i<6000;i+=25){
    coins.push({
        x:i*20,
        y:terrain[i]-80,
        taken:false
    });
}

const fuels=[];

for(let i=50;i<6000;i+=80){
    fuels.push({
        x:i*20,
        y:terrain[i]-90,
        taken:false
    });
}

const car={
    x:200,
    y:0,
    vx:0,
    vy:0,
    angle:0,
    fuel:100,
    coins:0
};

let gameStarted=false;

function startGame(){
    document.getElementById("startScreen").style.display="none";
    gameStarted=true;
}

function drawRect(x,y,w,h,color){
    ctx.fillStyle=color;
    ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function update(){

    if(!gameStarted) return;

    const ground=groundHeight(car.x);

    if(keys.right && car.fuel>0){
        car.vx+=0.16;
        car.fuel-=0.03;
    }

    if(keys.left && car.fuel>0){
        car.vx-=0.08;
        car.fuel-=0.02;
    }

    car.vx*=0.992;
    car.vy+=0.38;

    car.x+=car.vx;
    car.y+=car.vy;

    if(car.y>ground-35){
        car.y=ground-35;
        car.vy=0;

        const front=groundHeight(car.x+30);
        const back=groundHeight(car.x-30);

        car.angle=Math.atan2(front-back,60);
    }

    for(const coin of coins){
        if(!coin.taken){
            const dx=car.x-coin.x;
            const dy=car.y-coin.y;

            if(Math.hypot(dx,dy)<45){
                coin.taken=true;
                car.coins++;
            }
        }
    }

    for(const fuel of fuels){
        if(!fuel.taken){
            const dx=car.x-fuel.x;
            const dy=car.y-fuel.y;

            if(Math.hypot(dx,dy)<45){
                fuel.taken=true;
                car.fuel=Math.min(100,car.fuel+45);
            }
        }
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const camX=car.x-canvas.width/3;

    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#FFD93D";
    ctx.beginPath();
    ctx.arc(canvas.width-120,100,50,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#7895B2";

    for(let i=0;i<15;i++){
        ctx.fillRect(
            i*350-(camX*0.2)%350,
            canvas.height-360,
            220,
            360
        );
    }

    ctx.beginPath();
    ctx.moveTo(0,canvas.height);

    for(let x=0;x<canvas.width;x++){
        const worldX=x+camX;
        const y=groundHeight(worldX);
        ctx.lineTo(x,y);
    }

    ctx.lineTo(canvas.width,canvas.height);

    ctx.fillStyle="#43AA4A";
    ctx.fill();

    ctx.fillStyle="#7B4F2C";
    ctx.fillRect(0,canvas.height-50,canvas.width,50);

    for(const coin of coins){
        if(!coin.taken){
            drawRect(
                coin.x-camX,
                coin.y,
                18,
                18,
                "#FFD700"
            );
        }
    }

    for(const fuel of fuels){
        if(!fuel.taken){

            drawRect(
                fuel.x-camX,
                fuel.y,
                22,
                26,
                "#FF3333"
            );

            drawRect(
                fuel.x-camX+7,
                fuel.y+6,
                8,
                14,
                "white"
            );
        }
    }

    ctx.save();

    ctx.translate(car.x-camX,car.y);
    ctx.rotate(car.angle);

    drawRect(-35,-20,70,25,"#D62828");
    drawRect(-10,-40,30,22,"#FF6B6B");

    drawRect(-28,2,18,18,"black");
    drawRect(12,2,18,18,"black");

    drawRect(-22,8,6,6,"gray");
    drawRect(18,8,6,6,"gray");

    ctx.restore();

    document.getElementById("distance").innerText=
        "Distance: "+Math.floor(car.x/10)+"m";

    document.getElementById("fuel").innerText=
        "Fuel: "+Math.floor(car.fuel)+"%";

    document.getElementById("coins").innerText=
        "Coins: "+car.coins;

    if(car.fuel<=0 && Math.abs(car.vx)<0.05){

        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.font="48px monospace";
        ctx.fillText(
            "GAME OVER",
            canvas.width/2-170,
            canvas.height/2
        );

        ctx.font="24px monospace";

        ctx.fillText(
            "Обнови страницу для рестарта",
            canvas.width/2-190,
            canvas.height/2+50
        );
    }
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

car.y=groundHeight(car.x)-35;

loop();
</script>

</body>
</html>
